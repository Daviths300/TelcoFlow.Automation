services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: telcoflow-sqlserver
    hostname: telcoflow-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "${MSSQL_PORT:-14333}:1433"

    volumes:
      - telcoflow_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

volumes:
  telcoflow_sql_data:
